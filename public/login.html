<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — SaveHatke AI</title>
  <meta name="description" content="Sign in to SaveHatke AI to open the chatbot, manage your account, and generate API keys.">
  <meta name="theme-color" content="#060d1f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <header class="site-header" data-header>
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="SaveHatke AI home">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="8" fill="#00e676"/>
          <path d="M10 11.6a6 6 0 0 1 12 0V17a6 6 0 0 1-4.7 5.86l-.5 1.64a.9.9 0 0 1-1.6 0l-.5-1.64A6 6 0 0 1 10 17v-5.4Z" fill="#fff"/>
          <circle cx="13.2" cy="14" r="1.3" fill="#00e676"/>
          <circle cx="18.8" cy="14" r="1.3" fill="#00e676"/>
        </svg>
        <span class="brand-name">SaveHatke<em>&nbsp;AI</em></span>
      </a>

      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul class="nav-list">
          <li><a class="nav-link" href="index.html">Home</a></li>
          <li data-nav-auth="user" hidden><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li data-nav-auth="user" hidden><a class="avatar" href="profile.html" data-avatar>?</a></li>
        </ul>
      </nav>

      <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
      </button>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-head">
        <a class="brand" href="index.html" aria-label="SaveHatke AI home">
          <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="28" height="28" rx="8" fill="#00e676"/>
            <path d="M10 11.6a6 6 0 0 1 12 0V17a6 6 0 0 1-4.7 5.86l-.5 1.64a.9.9 0 0 1-1.6 0l-.5-1.64A6 6 0 0 1 10 17v-5.4Z" fill="#fff"/>
            <circle cx="13.2" cy="14" r="1.3" fill="#00e676"/>
            <circle cx="18.8" cy="14" r="1.3" fill="#00e676"/>
          </svg>
          <span class="brand-name">SaveHatke<em>&nbsp;AI</em></span>
        </a>
        <h1 class="auth-title">Welcome to SaveHatke AI</h1>
        <p class="auth-sub">Sign in to continue to your dashboard.</p>
      </div>

      <button class="btn btn-google btn-block btn-lg" type="button" id="google-signin">
        <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17Z"/>
          <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46Z"/>
          <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7Z"/>
          <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07Z"/>
        </svg>
        Continue with Google
      </button>

      <p class="notice" hidden id="form-note">
        <span class="notice-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </span>
        <span id="form-note-text"></span>
      </p>

      <p class="auth-fine">
        SaveHatke AI signs you in with Google — there is no password to create or
        remember. By continuing you agree to the <a href="terms.html">Terms</a>
        and <a href="privacy.html">Privacy</a> policy.
      </p>
    </div>
  </main>

  <script src="core.js" defer></script>
  <script src="auth.js" defer></script>
</body>
</html>
